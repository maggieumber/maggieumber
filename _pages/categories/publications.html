---
title: Publications
permalink: /publications
---

<p>
  This category covers longer length works featured in their own publications, including zines, comics, and graphic novels.
</p>
<hr />

<h3>Publications</h3>
<div class="gallery">
  {% for post in site.posts %} {% if post.categories contains 'publications' %}
  <figure class="gallery-item">
    <a href="{{ post.url }}">
      <img class="thumbnail-300" src="{{ post.cover.path }}" alt="{{ post.cover.alt }}" title="copyright Maggie Umber"/></a>
      <figcaption><a href="{{ post.url }}">{{ post.date | date: "%m/%d/%y" }}<br />{{ post.title }}</a></figcaption>
  </figure>
  {% endif %} {% endfor %}
</div>
