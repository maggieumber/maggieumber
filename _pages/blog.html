---
title: Blog
permalink: /blog
---

<hr />
<p>
  Categories: {% for category in site.categories %}
  <a href="/{{ category[0] }}">{{ category[0] }}</a>{% unless forloop.last %},
  {% endunless %} {% endfor %}
<p>

<div class="gallery">
  {% for post in site.posts %}
  <figure class="gallery-item">
    <a href="{{ post.url }}">
      <img class="thumbnail-300" src="{{ post.cover.path }}" alt="{{ post.cover.alt }}" title="copyright Maggie Umber"/></a>
      <figcaption><a href="{{ post.url }}">{{ post.date | date: "%m/%d/%y" }}<br />{{ post.title }}</a></figcaption>
  </figure>
  {% endfor %}
</div>
