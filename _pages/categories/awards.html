title: Awards
permalink: /awards

<p>
  This section is for Best of Lists, Awards, and other accolades. 
</p>
<hr />

<h3>Awards</h3>
<div class="gallery">
  {% for post in site.posts %} {% if post.categories contains 'awards' %}
  <figure class="gallery-item">
    <a href="{{ post.url }}">
      <img class="thumbnail-300" src="{{ post.cover.path }}" alt="{{ post.cover.alt }}" title="copyright Maggie Umber"/></a>
      <figcaption><a href="{{ post.url }}">{{ post.date | date: "%m/%d/%y" }}<br />{{ post.title }}</a></figcaption>
  </figure>
  {% endif %} {% endfor %}
</div>
